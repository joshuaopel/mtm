<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- A monster truck at 16x16, drawn on the pixel grid to match the game's
       nearest-neighbour look rather than being scaled down from artwork. -->
  <rect width="16" height="16" fill="#14140f"/>
  <rect x="2" y="4" width="9" height="3" fill="#b8400c"/>
  <rect x="3" y="3" width="6" height="2" fill="#8a2c08"/>
  <rect x="4" y="4" width="4" height="1" fill="#c8c8b4"/>
  <rect x="2" y="7" width="12" height="2" fill="#ffb020"/>
  <rect x="1" y="9" width="4" height="4" fill="#24241e"/>
  <rect x="2" y="10" width="2" height="2" fill="#6e6e5e"/>
  <rect x="9" y="9" width="4" height="4" fill="#24241e"/>
  <rect x="10" y="10" width="2" height="2" fill="#6e6e5e"/>
  <rect x="0" y="13" width="16" height="3" fill="#6b4a26"/>
</svg>
